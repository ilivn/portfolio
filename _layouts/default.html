<!DOCTYPE html>

<html lang="{{ site.lang }}">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    {% if page.title %}
      {{ page.title }} ·
    {% endif %}
    {{ site.title }}
  </title>

  <meta
    name="description"
    content="{{ page.resume | default: site.description }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/css/style.css' | relative_url }}"
  >

</head>


<body>

  <header class="main-header">

    <div class="header-container">

      <a
        href="{{ '/' | relative_url }}"
        class="logo"
      >
        IS<span>.</span>
      </a>


      <nav class="main-nav">

        <a href="{{ '/' | relative_url }}#accueil">
          Accueil
        </a>

        <a href="{{ '/' | relative_url }}#apropos">
          À propos
        </a>

        <a href="{{ '/' | relative_url }}#projets">
          Projets
        </a>

        <a href="{{ '/' | relative_url }}#competences">
          Compétences
        </a>

        <a href="{{ '/' | relative_url }}#contact">
          Contact
        </a>

      </nav>

    </div>

  </header>


  <main>

    {{ content }}

  </main>


  <footer class="site-footer">

    <p>
      © 2025 — Portfolio de Ilian SEGHIRI
    </p>

    <p>

      {% if site.email != "" %}

      <a href="mailto:{{ site.email }}">
        {{ site.email }}
      </a>

      {% endif %}

      {% if site.linkedin != "" %}

      ·

      <a href="{{ site.linkedin }}">
        LinkedIn
      </a>

      {% endif %}

      ·

      <a href="{{ '/mentions-legales/' | relative_url }}">
        Mentions légales
      </a>

    </p>

  </footer>


</body>

</html>
